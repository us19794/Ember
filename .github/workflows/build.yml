name: Build Ember APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q Ember.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        shell: bash
        working-directory: Ember
        run: gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        shell: bash
        working-directory: Ember
        run: |
          {
            echo '### Build errors'
            echo '```'
            if [ -f build.log ]; then
              if grep -qE "What went wrong|^e: " build.log; then
                grep -E -A12 "What went wrong|^e: " build.log | head -n 60
              else
                tail -n 60 build.log
              fi
            else
              echo "No build log (the failure happened before Gradle started)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Ember-debug-apk
          path: Ember/app/build/outputs/apk/debug/app-debug.apk
